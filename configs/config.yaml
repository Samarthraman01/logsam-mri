# LoGSAM Configuration File
# All project settings live here - never hardcode these in Python files

project:
  name: logsam-mri
  seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  manifests_dir: data/manifests
  image_size: 512
  num_classes: 4
  classes:
    - glioma
    - meningioma
    - pituitary
    - healthy

speech:
  whisper_model: large-v3
  language: de          # German dictations
  translate: true       # translate to English

nlp:
  spacy_model: en_core_web_lg
  confidence_threshold: 0.5
  synonyms:
    glioma:
      - glioblastoma
      - astrocytoma
      - oligodendroglioma
    meningioma:
      - meningeal tumor
    pituitary:
      - macroadenoma
      - microadenoma
      - pituitary adenoma

detection:
  model: grounding_dino
  backbone: swin_t
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.05
  confidence_threshold: 0.3
  epochs: 125
  batch_size: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 5.0

segmentation:
  model: medsam
  checkpoint: checkpoints/medsam_vit_b.pth
  frozen: true          # MedSAM is never trained, only used for inference
